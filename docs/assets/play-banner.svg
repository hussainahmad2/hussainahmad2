<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170" role="img" aria-label="Play Commit Snake" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="clip"><rect width="840" height="170" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="840" height="170" fill="#0d1117"/>
    <rect x="0.5" y="0.5" width="839" height="169" rx="12" fill="none" stroke="#30363d"/>

    <!-- contribution grid -->
    <g fill="#1c2128">
      <g id="row">
        <rect x="20" y="20" width="22" height="22" rx="4"/><rect x="48" y="20" width="22" height="22" rx="4"/>
        <rect x="76" y="20" width="22" height="22" rx="4"/><rect x="104" y="20" width="22" height="22" rx="4"/>
        <rect x="132" y="20" width="22" height="22" rx="4"/><rect x="160" y="20" width="22" height="22" rx="4"/>
        <rect x="188" y="20" width="22" height="22" rx="4"/><rect x="216" y="20" width="22" height="22" rx="4"/>
        <rect x="244" y="20" width="22" height="22" rx="4"/><rect x="272" y="20" width="22" height="22" rx="4"/>
        <rect x="300" y="20" width="22" height="22" rx="4"/><rect x="328" y="20" width="22" height="22" rx="4"/>
        <rect x="356" y="20" width="22" height="22" rx="4"/><rect x="384" y="20" width="22" height="22" rx="4"/>
        <rect x="412" y="20" width="22" height="22" rx="4"/><rect x="440" y="20" width="22" height="22" rx="4"/>
        <rect x="468" y="20" width="22" height="22" rx="4"/><rect x="496" y="20" width="22" height="22" rx="4"/>
        <rect x="524" y="20" width="22" height="22" rx="4"/><rect x="552" y="20" width="22" height="22" rx="4"/>
        <rect x="580" y="20" width="22" height="22" rx="4"/><rect x="608" y="20" width="22" height="22" rx="4"/>
        <rect x="636" y="20" width="22" height="22" rx="4"/><rect x="664" y="20" width="22" height="22" rx="4"/>
        <rect x="692" y="20" width="22" height="22" rx="4"/><rect x="720" y="20" width="22" height="22" rx="4"/>
        <rect x="748" y="20" width="22" height="22" rx="4"/><rect x="776" y="20" width="22" height="22" rx="4"/>
        <rect x="804" y="20" width="22" height="22" rx="4"/>
      </g>
      <use href="#row" y="28"/><use href="#row" y="56"/><use href="#row" y="84"/><use href="#row" y="112"/>
    </g>

    <!-- text panel -->
    <rect x="0" y="0" width="840" height="170" fill="#0d1117" opacity="0.72"/>
    <text x="420" y="78" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="36" font-weight="700" fill="#e6edf3">Play Commit Snake</text>
    <text x="420" y="108" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="16" fill="#8b949e">A tiny game on a contribution graph. Click to play.</text>

    <!-- moving snake along the bottom row -->
    <g>
      <animateTransform attributeName="transform" type="translate" from="-170" to="870" dur="6s" repeatCount="indefinite"/>
      <rect x="0" y="132" width="22" height="22" rx="4" fill="#196c2e"/>
      <rect x="28" y="132" width="22" height="22" rx="4" fill="#238636"/>
      <rect x="56" y="132" width="22" height="22" rx="4" fill="#2ea043"/>
      <rect x="84" y="132" width="22" height="22" rx="4" fill="#3fb950"/>
      <rect x="112" y="132" width="22" height="22" rx="4" fill="#56d364"/>
    </g>
    <rect x="636" y="132" width="22" height="22" rx="4" fill="#388bfd">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
