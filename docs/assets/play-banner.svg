<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Play Commit Snake">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#12233f"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="900" height="200" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="200" fill="url(#bg)"/>

    <!-- contribution grid -->
    <g opacity="0.95">
      <g id="cellRow" fill="#161b22">
        <rect x="24" y="24" width="14" height="14" rx="3"/>
        <rect x="42" y="24" width="14" height="14" rx="3"/>
        <rect x="60" y="24" width="14" height="14" rx="3"/>
        <rect x="78" y="24" width="14" height="14" rx="3"/>
        <rect x="96" y="24" width="14" height="14" rx="3"/>
        <rect x="114" y="24" width="14" height="14" rx="3"/>
        <rect x="132" y="24" width="14" height="14" rx="3"/>
        <rect x="150" y="24" width="14" height="14" rx="3"/>
        <rect x="168" y="24" width="14" height="14" rx="3"/>
        <rect x="186" y="24" width="14" height="14" rx="3"/>
        <rect x="204" y="24" width="14" height="14" rx="3"/>
        <rect x="222" y="24" width="14" height="14" rx="3"/>
        <rect x="240" y="24" width="14" height="14" rx="3"/>
        <rect x="258" y="24" width="14" height="14" rx="3"/>
        <rect x="276" y="24" width="14" height="14" rx="3"/>
        <rect x="294" y="24" width="14" height="14" rx="3"/>
        <rect x="312" y="24" width="14" height="14" rx="3"/>
        <rect x="330" y="24" width="14" height="14" rx="3"/>
        <rect x="348" y="24" width="14" height="14" rx="3"/>
        <rect x="366" y="24" width="14" height="14" rx="3"/>
        <rect x="384" y="24" width="14" height="14" rx="3"/>
        <rect x="402" y="24" width="14" height="14" rx="3"/>
        <rect x="420" y="24" width="14" height="14" rx="3"/>
        <rect x="438" y="24" width="14" height="14" rx="3"/>
        <rect x="456" y="24" width="14" height="14" rx="3"/>
        <rect x="474" y="24" width="14" height="14" rx="3"/>
        <rect x="492" y="24" width="14" height="14" rx="3"/>
        <rect x="510" y="24" width="14" height="14" rx="3"/>
        <rect x="528" y="24" width="14" height="14" rx="3"/>
        <rect x="546" y="24" width="14" height="14" rx="3"/>
        <rect x="564" y="24" width="14" height="14" rx="3"/>
        <rect x="582" y="24" width="14" height="14" rx="3"/>
        <rect x="600" y="24" width="14" height="14" rx="3"/>
        <rect x="618" y="24" width="14" height="14" rx="3"/>
        <rect x="636" y="24" width="14" height="14" rx="3"/>
        <rect x="654" y="24" width="14" height="14" rx="3"/>
        <rect x="672" y="24" width="14" height="14" rx="3"/>
        <rect x="690" y="24" width="14" height="14" rx="3"/>
        <rect x="708" y="24" width="14" height="14" rx="3"/>
        <rect x="726" y="24" width="14" height="14" rx="3"/>
        <rect x="744" y="24" width="14" height="14" rx="3"/>
        <rect x="762" y="24" width="14" height="14" rx="3"/>
        <rect x="780" y="24" width="14" height="14" rx="3"/>
        <rect x="798" y="24" width="14" height="14" rx="3"/>
        <rect x="816" y="24" width="14" height="14" rx="3"/>
        <rect x="834" y="24" width="14" height="14" rx="3"/>
        <rect x="852" y="24" width="14" height="14" rx="3"/>
      </g>
      <use href="#cellRow" y="18"/>
      <use href="#cellRow" y="36"/>
      <use href="#cellRow" y="54"/>
      <use href="#cellRow" y="72"/>
      <use href="#cellRow" y="90"/>
      <use href="#cellRow" y="108"/>
      <use href="#cellRow" y="126"/>
      <use href="#cellRow" y="144"/>
    </g>

    <!-- lit cells -->
    <g>
      <rect x="96" y="60" width="14" height="14" rx="3" fill="#196c2e"/>
      <rect x="114" y="60" width="14" height="14" rx="3" fill="#238636"/>
      <rect x="204" y="96" width="14" height="14" rx="3" fill="#2ea043"/>
      <rect x="294" y="42" width="14" height="14" rx="3" fill="#238636"/>
      <rect x="420" y="78" width="14" height="14" rx="3" fill="#3fb950"/>
      <rect x="528" y="114" width="14" height="14" rx="3" fill="#196c2e"/>
      <rect x="618" y="60" width="14" height="14" rx="3" fill="#2ea043"/>
      <rect x="726" y="96" width="14" height="14" rx="3" fill="#238636"/>
      <rect x="780" y="42" width="14" height="14" rx="3" fill="#3fb950"/>
    </g>

    <!-- dim overlay for readability -->
    <rect width="900" height="200" fill="#0d1117" opacity="0.55"/>

    <!-- left accent bar -->
    <rect x="0" y="0" width="6" height="200" fill="#1f6feb"/>

    <!-- copy -->
    <text x="48" y="78" font-family="'Segoe UI',system-ui,sans-serif" font-size="14" font-weight="600" fill="#58a6ff" letter-spacing="2">INTERACTIVE</text>
    <text x="48" y="118" font-family="'Segoe UI',system-ui,sans-serif" font-size="40" font-weight="700" fill="#e6edf3">Play Commit Snake</text>
    <text x="48" y="150" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" fill="#8b949e">Eat commits. Ship the stack. Beat your best score.</text>

    <!-- CTA pill -->
    <g transform="translate(680, 78)">
      <rect width="168" height="44" rx="8" fill="url(#cta)"/>
      <text x="84" y="28" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" font-weight="700" fill="#04130a">Play now →</text>
    </g>

    <!-- animated snake -->
    <g filter="url(#soft)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="-120,156; 980,156" dur="7s" repeatCount="indefinite"/>
        <rect x="0" y="0" width="14" height="14" rx="3" fill="#196c2e"/>
        <rect x="18" y="0" width="14" height="14" rx="3" fill="#238636"/>
        <rect x="36" y="0" width="14" height="14" rx="3" fill="#2ea043"/>
        <rect x="54" y="0" width="14" height="14" rx="3" fill="#3fb950"/>
        <rect x="72" y="0" width="14" height="14" rx="3" fill="#56d364"/>
      </g>
    </g>

    <!-- pulsing food -->
    <rect x="792" y="156" width="14" height="14" rx="3" fill="#388bfd">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <rect x="0.5" y="0.5" width="899" height="199" rx="16" fill="none" stroke="#30363d"/>
  </g>
</svg>
